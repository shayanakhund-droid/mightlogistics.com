<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Might Logistics | Operations Portal</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="admin.css?v=6"><link rel="stylesheet" href="quote.css?v=1"><link rel="stylesheet" href="loads.css?v=2"><link rel="stylesheet" href="carriers.css?v=2">
</head>
<body>
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="brand-mark">M</div><div class="eyebrow">MIGHT LOGISTICS</div><h1>Operations Portal</h1>
    <p id="loginSubtitle" class="muted">Enter your work email to receive a secure sign-in code.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@mightlogistics.com"></label>
      <div id="otpField" class="hidden"><label>Verification code<input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000"></label></div>
      <button id="loginButton" class="primary" type="submit">Send verification code</button>
      <button id="changeEmail" class="ghost hidden" type="button">Use a different email</button>
      <button id="resendOtp" class="ghost hidden" type="button">Resend code</button>
      <div id="otpTimer" class="muted hidden" aria-live="polite"></div>
      <div id="loginError" class="error" role="alert"></div>
    </form>
    <div class="login-foot">Authorized Might Logistics personnel only.</div>
  </div>
</div>
<div id="appView" class="app hidden">
<!-- existing portal markup retained below -->
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=7"></script>
</body></html>
